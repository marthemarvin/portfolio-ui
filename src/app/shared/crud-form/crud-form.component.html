<form class="stack" [formGroup]="form" (ngSubmit)="save()" novalidate>
  @for (field of fields; track field.name) {
    @if (field.type === 'checkbox') {
      <label class="checkbox">
        <input type="checkbox" [formControlName]="field.name">
        {{ field.label }}
      </label>
    } @else if (field.type === 'image') {
      <app-form-field [label]="field.label" [fieldId]="field.name" [error]="imageErrors[field.name] || null">
        @if (imagePreview(field); as preview) {
          <img class="image-preview" [src]="preview" alt="">
        }
        <div class="image-actions">
          <input #file [id]="field.name" type="file" accept="image/*" (change)="chooseImage(field, $event)"
                 [attr.aria-describedby]="field.name + '-error'">
          @if (imagePreview(field)) {
            <button type="button" class="link" (click)="removeImage(field, file)">Remove image</button>
          }
        </div>
      </app-form-field>
    } @else {
      <app-form-field [label]="field.label" [fieldId]="field.name" [error]="errorFor(field)">
        @if (field.type === 'textarea') {
          <textarea [id]="field.name" [formControlName]="field.name" rows="4"
                    [attr.aria-invalid]="!!errorFor(field)" [attr.aria-describedby]="field.name + '-error'"></textarea>
        } @else {
          <input [id]="field.name" [type]="field.type" [formControlName]="field.name"
                 [placeholder]="field.placeholder ?? (field.type === 'url' ? 'https://' : '')"
                 [attr.aria-invalid]="!!errorFor(field)" [attr.aria-describedby]="field.name + '-error'">
        }
      </app-form-field>
    }
  }

  @if (error) {
    <p class="form-error" role="alert">{{ error }}</p>
  }

  <div class="form-actions">
    <button type="submit" [disabled]="saving">{{ saving ? busyLabel : saveLabel }}</button>
    @if (showCancel) {
      <button type="button" class="secondary" (click)="cancelled.emit()">Cancel</button>
    }
  </div>
</form>
