<main class="page theme-pink">
  <section class="panel" aria-labelledby="login-title">
    <a class="back" routerLink="/">Back to portfolio</a>

    <h1 id="login-title">Sign in</h1>

    <form class="stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field label="Email" fieldId="email" [error]="emailError()">
        <input id="email" type="email" formControlName="email" autocomplete="username"
               [attr.aria-invalid]="!!emailError()" aria-describedby="email-error">
      </app-form-field>

      <app-form-field label="Password" fieldId="password" [error]="passwordError()">
        <input id="password" type="password" formControlName="password" autocomplete="current-password"
               [attr.aria-invalid]="!!passwordError()" aria-describedby="password-error">
      </app-form-field>

      @if (error) {
        <p class="form-error" role="alert">{{ error }}</p>
      }

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
