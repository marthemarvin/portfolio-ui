<app-page-header title="About" />

@if (error) {
  <p class="form-error" role="alert">{{ error }}</p>
} @else if (loaded) {
  <app-crud-form [wide]="true" [fields]="fields" [value]="about" [saveWith]="saveAbout" saveLabel="Save"
                 [showCancel]="false" (saved)="saved = true" />
  @if (saved) {
    <p class="saved" role="status">Saved.</p>
  }

  <app-crud-page class="additional-info" title="Additional info" itemName="additional info" [service]="additionalInfo"
                 [fields]="additionalInfoFields" [columns]="additionalInfoColumns" [reorderable]="true" />
} @else {
  <p>Loading…</p>
}
