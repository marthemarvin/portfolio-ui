<header class="topbar">
  <nav aria-label="Pages">
    @for (page of pages; track page.path) {
      <a [routerLink]="page.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page">{{ page.label }}</a>
    }
  </nav>
</header>

<main class="home">
  <router-outlet />
</main>
