<app-page-header title="Skills" />

@if (error) {
  <p class="form-error" role="alert">{{ error }}</p>
} @else if (groups) {
  @for (group of groups; track group.category) {
    <section class="group" [attr.aria-label]="group.category">
      <h2>{{ group.category }}</h2>
      <ul class="skills">
        @for (skill of group.skills; track skill.id) {
          <li>
            @if (skill.icon) {
              <img [src]="skill.icon" alt="">
            }
            {{ skill.name }}
          </li>
        }
      </ul>
    </section>
  } @empty {
    <p>No skills yet.</p>
  }
} @else {
  <p>Loading…</p>
}
